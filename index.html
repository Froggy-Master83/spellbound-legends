<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spellbound Legends</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="start-screen">

        <img
            id="game-title"
            src="assets/ui/title.png"
            alt="Spellbound Legends"
        >

        <div id="menu-buttons">

            <button id="play-button">
                <img src="assets/ui/play.png" alt="Play">
            </button>

            <button id="new-wizard-button">
                <img src="assets/ui/new-wizard.png" alt="New Wizard">
            </button>

        </div>

    </div>

    <script src="game.js"></script>

</body>
</html>
